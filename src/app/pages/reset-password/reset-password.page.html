<main class="recovery-page">
  <section class="recovery-card">
    <h1>Reset password</h1>

    <p *ngIf="mode === 'checking'">Checking the recovery link.</p>

    <p class="recovery-message" *ngIf="message">{{ message }}</p>

    <form *ngIf="mode === 'expired' || mode === 'missing' || mode === 'disabled'" (ngSubmit)="requestLink()" novalidate>
      <label for="recovery-email">Email address</label>
      <input id="recovery-email" name="recovery-email" type="email" [(ngModel)]="email" autocomplete="email">
      <button type="submit" [disabled]="isLoading">Request a new link</button>
    </form>

    <form *ngIf="mode === 'ready'" (ngSubmit)="savePassword()" novalidate>
      <label for="recovery-password">New password</label>
      <input id="recovery-password" name="recovery-password" type="password" [(ngModel)]="password" autocomplete="new-password">
      <label for="recovery-confirm">Confirm password</label>
      <input id="recovery-confirm" name="recovery-confirm" type="password" [(ngModel)]="confirmPassword" autocomplete="new-password">
      <button type="submit" [disabled]="isLoading">Update password</button>
    </form>

    <p *ngIf="mode === 'sent'">Check that email, then open the newest recovery link.</p>
    <p *ngIf="mode === 'updated'">The recovery session has been signed out.</p>

    <a routerLink="/login">Back to sign in</a>
  </section>
</main>
